name: crew
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate every crew member
        run: |
          status=0
          for d in crew/*/; do node sdk/ferry-plugin.ts validate "$d" || status=1; done
          exit $status
      - name: Contributors must not edit dist/ or sdk/
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}" -- dist sdk | grep -q .; then
            echo "dist/ is rebuilt by harbor masters after merging, and sdk/ is synced from the Ferry app repo. Please remove your changes to them."; exit 1
          fi
      - name: Runtime tests
        run: npm test
